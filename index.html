<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10191c" />
    <meta name="description" content="PetroVista 3D — Explore. Understand. Simulate." />
    <title>PetroVista 3D | پالایشگاه هوشمند</title>
    <style>
      *{box-sizing:border-box}html,body,#root{width:100%;height:100%;margin:0}body{overflow:hidden;background:#0b1217;color:#e7eef0;font:12px Tahoma,Arial,sans-serif}
      .pv-boot-loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;overflow:auto;background:radial-gradient(ellipse at 50% 38%,#263c37 0,#101c20 48%,#0a1116 100%);color:#e6eef0}
      .pv-boot-card{direction:ltr;width:min(590px,100%);padding:26px;border:1px solid #4c667055;border-radius:18px;background:linear-gradient(145deg,#1a2a30f5,#111b20f7);box-shadow:0 28px 100px #0009,inset 0 1px #ffffff0b;text-align:center}
      .pv-boot-brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:9px}.pv-boot-mark{width:38px;height:38px;display:grid;place-items:center;border:1px solid #588270;border-radius:11px;background:#1c4036;color:#a8dec0;font-weight:800;letter-spacing:.5px}.pv-boot-brand b{font-size:16px;letter-spacing:.1px}.pv-boot-brand i{font-style:normal;color:#75c7d2}.pv-boot-brand small{display:block;margin-top:4px;color:#8299a0;font:8px Tahoma,Arial,sans-serif;letter-spacing:1.6px}
      .pv-boot-title{margin:17px 0 4px;font-size:14px}.pv-boot-subtitle{margin:0;color:#91a6a9;font-size:10px}
      .pv-refinery{position:relative;width:100%;height:155px;margin:20px auto 17px;overflow:hidden;border:1px solid #73909222;border-radius:13px;background:linear-gradient(180deg,#15272b,#142129 60%,#172622);}
      .pv-refinery:before{content:"";position:absolute;left:7%;right:7%;bottom:24px;height:25px;border-top:1px solid #77979a3b;background:repeating-linear-gradient(90deg,transparent 0 25px,#ffffff08 26px 27px)}
      .pv-refinery svg{position:absolute;inset:0;width:100%;height:100%}.pv-pipe{fill:none;stroke:#66888a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.pv-flow{fill:none;stroke:#efbd70;stroke-width:2;stroke-dasharray:4 12;stroke-linecap:round;animation:pv-flow 1.2s linear infinite}.pv-steel{fill:#637d7e;stroke:#a8bdb8;stroke-width:1}.pv-vessel{fill:#31484c;stroke:#91aaa4;stroke-width:1.1}.pv-platform{fill:none;stroke:#d3bd82;stroke-width:1}.pv-window{fill:#67bec8;opacity:.8}.pv-smoke{fill:#82979b;opacity:.16;transform-origin:center;animation:pv-smoke 3s ease-in-out infinite}.pv-lamp{fill:#e8b965;filter:drop-shadow(0 0 5px #e8b965)}.pv-tank-level{fill:#4d9d8d;opacity:.8}.pv-loader-stages{position:relative;isolation:isolate;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;text-align:center;direction:ltr}.pv-loader-stages:before{content:"";position:absolute;z-index:-1;top:7px;left:10%;width:80%;height:1px;background:#42575c}.pv-loader-stage{position:relative;display:grid;justify-items:center;gap:7px;min-width:0;color:#81989a;font-size:8px;line-height:1.35;direction:ltr}.pv-loader-stage i{z-index:1;width:15px;height:15px;display:grid;place-items:center;border:1px solid #597074;border-radius:50%;background:#17262b;color:#91a9a8;font:6px ui-monospace,monospace;font-style:normal}.pv-loader-stage:first-child i{border-color:#c5a56c;box-shadow:0 0 0 4px #c5a56c1b}.pv-loader-stage span{max-width:100%;white-space:normal;overflow-wrap:anywhere}
      .pv-boot-progress-meta{display:flex;align-items:center;justify-content:space-between;margin-top:22px;color:#8da1a4;font-size:9px}.pv-boot-progress-meta b{color:#d8e5e6;font:600 12px ui-monospace,monospace}.pv-boot-track{height:8px;margin-top:8px;overflow:hidden;border:1px solid #78909122;border-radius:8px;background:#26383b}.pv-boot-track i{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#56a878,#7cc7a1,#78c8d1);box-shadow:0 0 16px #60bd9a66;transition:width .28s ease}.pv-boot-foot{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:16px;color:#778d91;font-size:8px}.pv-boot-foot i{width:5px;height:5px;border-radius:50%;background:#d8b46d;box-shadow:0 0 7px #d8b46d}
      .pv-oil-pulse{fill:#f0c175;stroke:#fff0cb;stroke-width:.8;filter:drop-shadow(0 0 5px #f2be6ae6)}.pv-oil-pulse.pulse-two{fill:#ffe2a0;opacity:.82}.pv-water-pulse{fill:#75c9d4;stroke:#d2f7f2;stroke-width:.8;filter:drop-shadow(0 0 4px #62cbdbd9)}.pv-tank-level{fill:#4d9d8d;opacity:.8;transform-box:fill-box;transform-origin:50% 100%;animation:pv-tank-cycle 3.8s ease-in-out infinite alternate}.pv-tank-level.fill-two{animation-delay:-1.1s}.pv-tank-level.fill-three{animation-delay:-2.2s}.pv-pump circle{fill:#203b3d;stroke:#9bbdb5;stroke-width:1}.pv-rotor{stroke:#e6c27e;stroke-width:1.5;stroke-linecap:round;transform-box:fill-box;transform-origin:center;animation:pv-rotor-spin 1.1s linear infinite}
      @keyframes pv-flow{to{stroke-dashoffset:-32}}@keyframes pv-smoke{0%,100%{opacity:.1;transform:translateY(2px) scale(.92)}50%{opacity:.24;transform:translateY(-3px) scale(1.08)}}@keyframes pv-tank-cycle{0%{transform:scaleY(.5);opacity:.55}55%{transform:scaleY(1);opacity:.9}100%{transform:scaleY(.72);opacity:.7}}@keyframes pv-rotor-spin{to{transform:rotate(360deg)}}
      @media(max-width:520px){.pv-boot-card{padding:18px 15px}.pv-refinery{height:130px;margin:15px auto}.pv-loader-stage{font-size:7px}.pv-loader-stages{gap:3px}.pv-boot-title{font-size:13px}}
      @media(prefers-reduced-motion:reduce){.pv-flow,.pv-smoke,.pv-tank-level,.pv-rotor{animation:none}.pv-oil-pulse,.pv-water-pulse{display:none}.pv-boot-track i{transition:none}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pv-boot-loader" role="status" aria-live="polite" lang="en" dir="ltr">
        <div class="pv-boot-card">
          <div class="pv-boot-brand"><span class="pv-boot-mark">PV</span><div><b>PetroVista <i>3D</i></b><small>REFINERY OPERATIONS VIEW</small></div></div>
          <h1 class="pv-boot-title">Preparing the refinery scene</h1><p class="pv-boot-subtitle">Process units, equipment, and monitoring systems are loading.</p>
          <div class="pv-refinery" aria-hidden="true"><svg viewBox="0 0 520 170" preserveAspectRatio="xMidYMid meet">
            <path class="pv-pipe" d="M25 130H493M58 130V93H197V130M192 130V110H337V130M335 130V88H463V130M72 93V61H135V93M225 110V54H268V110M393 88V45H438V88"/>
            <path class="pv-flow" d="M25 130H493M58 130V93H197V130M192 130V110H337V130M335 130V88H463V130"/>
            <circle class="pv-oil-pulse" r="3.4"><animateMotion dur="6.4s" repeatCount="indefinite" path="M25 130H58V93H197V130H225V110H337V130H335V88H393V45H438V88H463V130H493"/></circle>
            <circle class="pv-oil-pulse pulse-two" r="2.6"><animateMotion begin="2.1s" dur="6.4s" repeatCount="indefinite" path="M25 130H58V93H197V130H225V110H337V130H335V88H393V45H438V88H463V130H493"/></circle>
            <circle class="pv-water-pulse" r="2.5"><animateMotion dur="4.7s" repeatCount="indefinite" path="M282 130V111H299V99H311V130H363"/></circle>
            <path class="pv-vessel" d="M72 92V51q0-9 9-9h45q9 0 9 9v42M77 52h53M225 108V50q0-10 10-10h14q10 0 10 10v59M228 53h28M393 86V40q0-8 8-8h28q8 0 8 8v46M397 43h36"/>
            <path class="pv-steel" d="M33 129V105q0-10 10-10h19v35M43 95V78h18v17M297 130V75h16v55M292 75h27M300 75V61h10M304 61V46"/>
            <path class="pv-vessel" d="M452 124h40l-5 8h-29zM459 123v-8h10v8M472 123v-5h8v5"/><path class="pv-platform" d="M454 134h39m-30 0v4m21-4v4"/>
            <path class="pv-platform" d="M65 62h77M218 59h58M387 47h50M65 72h77M218 68h58M387 56h50"/>
            <rect class="pv-tank-level fill-one" x="83" y="82" width="41" height="10" rx="2"/><rect class="pv-tank-level fill-two" x="231" y="82" width="26" height="22" rx="2"/><rect class="pv-tank-level fill-three" x="401" y="69" width="28" height="15" rx="2"/>
            <g class="pv-pump" transform="translate(304 101)"><circle r="6"/><path class="pv-rotor" d="M0 -4v8M-4 0h8"/></g>
            <circle class="pv-lamp" cx="304" cy="43" r="3"/><circle class="pv-window" cx="42" cy="110" r="3"/><circle class="pv-window" cx="472" cy="112" r="3"/>
            <ellipse class="pv-smoke" cx="308" cy="33" rx="9" ry="6"/><ellipse class="pv-smoke" cx="315" cy="26" rx="12" ry="7"/>
            <path class="pv-platform" d="M26 137h468M39 139v8m43-8v8m43-8v8m43-8v8m43-8v8m43-8v8m43-8v8m43-8v8m43-8v8m43-8v8"/>
          </svg></div>
          <div class="pv-loader-stages"><div class="pv-loader-stage"><i>01</i><span>Crude feed</span></div><div class="pv-loader-stage"><i>02</i><span>Distillation</span></div><div class="pv-loader-stage"><i>03</i><span>Conversion</span></div><div class="pv-loader-stage"><i>04</i><span>Utilities</span></div><div class="pv-loader-stage"><i>05</i><span>Storage &amp; export</span></div></div>
          <div class="pv-boot-progress-meta"><span>Scene preparation</span><b><span id="pv-boot-percent">0</span>%</b></div><div class="pv-boot-track"><i id="pv-boot-bar"></i></div>
          <div class="pv-boot-foot"><i></i>Illustrative data · no live control connection</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
